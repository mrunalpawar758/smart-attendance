version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: smartattend_db
    environment:
      POSTGRES_USER: smartattend
      POSTGRES_PASSWORD: smartattend123
      POSTGRES_DB: smartattend_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartattend"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartattend_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smartattend:smartattend123@db:5432/smartattend_db
      JWT_SECRET: change-this-in-production-use-a-long-random-string
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      FACE_RECOGNITION_THRESHOLD: "0.55"
      DEFAULT_ATTENDANCE_THRESHOLD: "75.0"
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartattend_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
